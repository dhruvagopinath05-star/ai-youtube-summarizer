<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube AI Summarizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body><!-- HERO SECTION -->
    <div class="hero"><img src="youtube-blue.png" class="logo">
        <h1><span class="highlight">Summarize</span> your videos in seconds

        </h1>
        <p>Transform YouTube videos into clear, actionable summaries using AI

        </p>
        <div class="hero-buttons"><button id="startBtn">Start Summarizing for Free

            </button><button id="demoBtn">View Live Demo

            </button></div>
    </div><!-- LOGIN SECTION -->
    <div class="login-section">
        <h2>Welcome Back</h2>
        <p>Authentication Portal</p><button id="googleLogin">Sign in with Google

        </button>
    </div><!-- SUMMARIZER SECTION -->
    <div class="section" id="summarizer">
        <h2>Paste Your YouTube URL</h2><input type="text" id="youtubeUrl" placeholder="Paste YouTube link here..." «»
            <br><br>

        <button id="summarizeBtn">Summarize

        </button><br><br>

        <textarea id="result" placeholder="Video summary will appear here..."></textarea><br><br>

        <button id="saveBtn">Save Summary

        </button>
    </div>
    <script src="app.js"></script>
</body>

</html>
