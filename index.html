<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>OmniSummarize AI</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="firebase.js"></script>
    <script defer src="app.js"></script>

</head>

<body>


    <!-- HERO -->

    <div class="hero active" id="hero">

        <h1>
            <span class="highlight">Summarize</span> your videos in seconds
        </h1>

        <p>
            Transform YouTube videos into clear actionable summaries using AI
        </p>

        <button id="startBtn">Start Summarizing for Free</button>

        <button id="demoBtn">View Live Demo</button>

    </div>



    <!-- LOGIN -->

    <div class="section" id="login">

        <h2>Welcome Back</h2>

        <p>Authentication Portal</p>

        <button id="googleLogin">Sign in with Google</button>

    </div>



    <!-- SUMMARIZER -->

    <div class="section" id="summarizer">

        <h2>Paste YouTube URL</h2>

        <button class="youtubeBtn">
            <div class="youtubeIcon"></div>
            YouTube Video
        </button>

        <br><br>

        <input id="youtubeUrl" placeholder="Paste YouTube link here">

        <br>

        <button id="summarizeBtn">Summarize</button>

        <br>

        <textarea id="result"></textarea>

        <br>

        <button id="saveBtn">Save Summary</button>

    </div>

</body>

</html>
