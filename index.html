<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube AI Summarizer</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

</head>

<body>


    <!-- HERO SECTION -->

    <section class="hero">

        <h1 class="title">
            <span class="yellow">Summarize</span> your videos in seconds
        </h1>

        <p class="subtitle">
            Transform YouTube videos into clear, actionable summaries using AI
        </p>

        <div class="buttons">

            <button id="startBtn" class="glow-btn">
                Start Summarizing for Free
            </button>

            <button id="demoBtn" class="glow-btn">
                View Live Demo
            </button>

        </div>

    </section>



    <!-- LOGIN SECTION -->

    <section class="login">

        <h2>Welcome Back</h2>
        <p>Authentication Portal</p>

        <button id="googleLoginBtn" class="glow-btn">
            Sign in with Google
        </button>

    </section>



    <!-- SUMMARIZER -->

    <section id="summarizer" class="summarizer">

        <h2>Paste Your YouTube URL</h2>

        <input type="text" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." />

        <button id="summarizeBtn" class="glow-btn">
            Summarize
        </button>

        <textarea id="result" placeholder="Summary will appear here..."></textarea>

        <button id="saveBtn" class="glow-btn">
            Save Summary
        </button>

    </section>



    <script src="firebase.js"></script>
    <script src="app.js"></script>

</body>

</html>
